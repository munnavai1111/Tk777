<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Super Ace</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#02040b;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.game{width:100vw;height:100vh;height:100dvh;min-height:0;margin:0;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;background:#050a19;padding:0;border:0;border-radius:0;box-shadow:none}
.top{height:76px;flex:0 0 76px;position:relative;text-align:center;background:linear-gradient(180deg,#070a18 0%,#111528 72%,#281515 73%,#6e2d19 83%,#25100c 100%);border-bottom:3px solid #d28a36;box-shadow:0 4px 12px #000b}


.close{position:absolute;z-index:4;left:8px;top:8px;width:25px;height:25px;border:1px solid #b9a17c;border-radius:50%;background:#171b28;color:#fff;font-size:20px;line-height:18px;box-shadow:0 1px 5px #000}
.brand{display:block;position:absolute;bottom:8px;width:100%;font:bold 22px Georgia,serif;letter-spacing:.3px;color:#ffe6a0;text-shadow:0 2px #541b0c,0 0 4px #ffb43c,0 0 10px #ff8d20}
.buy-bonus{position:absolute;z-index:3;right:9px;top:8px;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 35% 25%,#fff58a,#ff9b08 42%,#bb1a08 72%,#4a0905);border:3px solid #ffd35d;color:#fff6b0;font-weight:1000;font-size:13px;line-height:12px;text-shadow:0 2px 3px #740800;box-shadow:0 2px 8px #000b,0 0 12px #f90}
.side-menu{position:absolute;z-index:3;left:-13px;top:49%;padding:12px 13px 12px 17px;border:2px solid #b68a3b;border-radius:0 12px 12px 0;background:linear-gradient(90deg,#15121a,#57411e);color:#ffe08a;font-weight:900;writing-mode:vertical-rl;text-orientation:mixed;box-shadow:0 2px 8px #000}
.multis{height:36px;flex:0 0 36px;width:min(82%,330px);margin:-1px auto 0;position:relative;z-index:3;display:flex;justify-content:space-around;align-items:center;border:2px solid #f5c86c;border-radius:20px;background:linear-gradient(180deg,#fff0a8 0%,#ffb52f 48%,#a94b0a 100%);box-shadow:0 2px 0 #55250b,0 0 12px #ff9e27}
.multi{border:0;background:transparent;color:#63310c;font-weight:900;font-size:16px;padding:4px 9px;border-radius:15px;min-width:42px;text-align:center;opacity:.82;transition:all .2s;text-shadow:0 1px #ffe8a0}
.multi.active{background:linear-gradient(180deg,#fffbd1,#ffc23b 65%,#f08a16);color:#6b2107;box-shadow:inset 0 1px 2px #fff,0 0 9px #fff0a5;opacity:1;transform:scale(1.08)}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:7px 5px 5px;margin-top:0;background:#050a19;border-top:5px solid #8b9294;border-bottom:5px solid #a95a24;box-shadow:inset 0 0 18px #000a,0 5px 12px #0008;position:relative}
.stage:before,.stage:after{content:"";position:absolute;left:0;right:0;height:5px;background:linear-gradient(90deg,#424a4d,#d7d6c8 22%,#777d7a 50%,#eee4c8 78%,#424a4d);box-shadow:0 1px 3px #000}
.stage:before{top:-5px}.stage:after{bottom:-5px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:2px;width:min(100%,420px);height:97%;max-height:97%;max-width:100%;aspect-ratio:.88/1;margin:auto;background:#4b5356;align-items:stretch;justify-items:stretch;padding:2px;border:2px solid #aeb8b8;box-shadow:0 0 0 2px #27343b,0 5px 16px #000b}
.tile{position:relative;overflow:hidden;border:1px solid #8b999c;border-radius:2px;background:linear-gradient(145deg,#e9f2ed,#a9c4ce);box-shadow:inset 0 0 0 1px #fff8,0 1px 2px #0008;display:flex;align-items:center;justify-content:center;transition:filter .12s}
.tile.empty{background:rgba(2,10,20,.38);border:1px solid rgba(130,157,166,.22);box-shadow:inset 0 0 7px rgba(0,0,0,.42)}
.tile img{width:100%;height:100%;object-fit:fill;display:block;padding:0;margin:0;background:transparent;min-width:0;min-height:0}.tile img.scatter-art{object-fit:contain}
.tile.dim{filter:brightness(.28) saturate(.65)}
.tile.scatter-fallback{filter:none!important;background:radial-gradient(circle at 35% 28%,#fff6a6 0,#f7b72c 42%,#9b4b08 76%,#542304 100%);border:2px solid #ffe69a;box-shadow:inset 0 0 0 2px #b66a13,0 0 8px #ffbf37}
.scatter-coin{width:90%;height:90%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 25%,#fffbd0,#f8c23e 45%,#b66a12 78%,#6d3307);border:2px solid #fff0a8;box-shadow:inset 0 0 0 2px #d18b1e,0 1px 5px #0009;color:#7a3506;text-shadow:0 1px #fff5b8}
.scatter-coin b{font:bold 34px Georgia;line-height:1}.scatter-coin small{font:bold 8px Arial;letter-spacing:.7px;color:#fff8d5;text-shadow:0 1px 2px #572500}
.tile.golden-card,.tile.golden-joker,.tile.golden-copy{border:1px solid #ffe28a;background:transparent;box-shadow:0 0 8px 2px rgba(255,202,42,.72)}
.tile.golden-copy:not(.golden-card):not(.golden-joker) img{filter:sepia(.78) saturate(2.05) hue-rotate(350deg) brightness(1.02) contrast(1.1)}
.tile.golden-card img{filter:saturate(.88)}

 .tile.golden-transform{animation:goldenTransform .62s ease both}
@keyframes goldenTransform{0%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.12);filter:brightness(2.1)}70%{transform:scale(1.08);filter:brightness(1.8)}100%{transform:scale(1);filter:brightness(1.35)}}
.tile.win{z-index:4;border:2px solid #fff7bb;box-shadow:0 0 0 1px #ffcf3e,0 0 12px 5px #ffe15c,0 0 28px 10px rgba(255,170,25,.7);animation:winPulse .48s ease-in-out infinite alternate}
.tile.win:after{content:"";position:absolute;inset:-20%;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,210,.85) 48%,transparent 63%);transform:translateX(-130%);animation:shineSweep .72s ease-in-out infinite}
.tile.drop{animation:cardDrop .42s ease-out both;will-change:transform,opacity}
.tile.flip-out{z-index:5;animation:cardFlipOut .28s ease-in both;pointer-events:none}
.tile.flip-in{z-index:5;animation:cardFlipIn .38s cubic-bezier(.2,.75,.25,1) both}
@keyframes cardFlipOut{0%{transform:scale(1);opacity:1;filter:brightness(1)}100%{transform:translateY(12%) scale(.72);opacity:0;filter:brightness(1.8)}}
@keyframes cardFlipIn{0%{transform:translateY(-115%) scale(.92);opacity:0;filter:brightness(1.5)}100%{transform:translateY(0) scale(1);opacity:1;filter:none}}
.tile.anticipation-line{z-index:6;border:2px solid #fff7a8;box-shadow:0 0 8px 4px #ffe45c,0 0 22px 8px #ffb52a;animation:anticipationGlow .13s ease-in-out infinite alternate}
@keyframes anticipationGlow{from{filter:brightness(1.1)}to{filter:brightness(2.2)}}
@keyframes winPulse{from{filter:brightness(1.05)}to{filter:brightness(1.65)}}
@keyframes shineSweep{0%{transform:translateX(-130%);opacity:0}25%{opacity:1}100%{transform:translateX(130%);opacity:0}}
@keyframes cardDrop{0%{transform:translateY(var(--fall-from,-115%));opacity:.9}100%{transform:translateY(0);opacity:1}}
.status{flex:0 0 18px;height:18px;text-align:center;padding-top:2px;font:bold 10px Arial;color:#ffe7a4;text-shadow:0 1px #321;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-line{display:block;visibility:hidden;flex:0 0 25px;height:25px;min-height:25px;text-align:center;color:#ffdf72;font:bold 15px Georgia;text-shadow:0 1px 3px #000}
.win-line.show{visibility:visible}
.controls{position:relative;flex:0 0 86px;min-height:86px;display:flex;align-items:center;justify-content:flex-start;padding:4px 10px;background:linear-gradient(180deg,#3a2117 0%,#1a120f 42%,#090b12 100%);border-top:3px solid #9b5b2c;border-bottom:1px solid #6d4929;gap:3px;box-shadow:0 -5px 16px #0009}
.ctrl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:#f6dfa6;min-width:35px;text-shadow:0 1px #000}
.round{width:27px;height:27px;border-radius:50%;border:1px solid #d7ad61;background:radial-gradient(circle at 35% 25%,#9c7950,#39251a 72%);color:#fff1bd;font-size:16px;font-weight:900;box-shadow:inset 0 1px 3px #fff5,0 2px 3px #000}
.bet-control{display:flex;flex-direction:row;gap:3px;align-items:center;min-width:0}.bet-value.bet-open{width:46px;height:46px;min-width:46px;padding:3px;border-radius:50%;justify-content:center}.bet-value.bet-open small{font-size:7px}.bet-value.bet-open b{font-size:11px}
.bet-value{min-width:34px;text-align:center;display:flex;flex-direction:column;gap:2px}
.bet-value small{font-size:8px;color:#f6dfa6}.bet-value b{font-size:12px;color:#fff}
.spin-control{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.spin{width:70px;height:70px;flex:0 0 70px;border-radius:50%;border:4px solid #ffdf85;background:radial-gradient(circle at 35% 25%,#fffbd0,#ffc02b 48%,#a64a05 82%);color:#672605;font-weight:1000;font-size:12px;box-shadow:0 0 0 3px #87400c,0 0 18px #ffb32a,inset 0 0 0 2px #fff8}
.right-controls{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.spin:disabled,.round:disabled{opacity:.5}
.balance{text-align:center;background:linear-gradient(90deg,#090b11,#322018,#090b11);padding:5px 4px 2px;color:#f2dca5;font-size:10px;border-top:1px solid #795a30;flex:0 0 24px}
.balance b{font-size:13px;color:white}
.note{text-align:center;background:#090b11;color:#b8ad98;font-size:8px;padding:1px 0 3px;flex:0 0 14px}
@media(min-width:500px){.game{width:100vw;height:100vh;height:100dvh;margin:0}.board{width:min(100%,420px)}}
@media(max-height:590px){.top{height:62px;flex-basis:62px}.stage{padding:4px}.controls{flex-basis:80px;min-height:80px}.spin{width:70px;height:70px;flex:0 0 70px}.status{flex-basis:16px;height:16px}.win-line{flex-basis:21px;height:21px}}
@media(prefers-reduced-motion:reduce){.tile.win,.tile.drop,.tile.win:after{animation:none}}
.free-overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.78)}
.free-overlay.show{display:flex}
.free-panel{width:min(92vw,340px);padding:25px 18px;text-align:center;border:2px solid #f5cf67;border-radius:18px;background:radial-gradient(ellipse at top,#6e3c13,#17101b 72%);box-shadow:0 0 35px #f5b83b66;color:#fff}
.free-panel h2{margin:0 0 10px;color:#ffe28a;font-size:25px;text-shadow:0 2px 8px #000}
.free-panel p{margin:8px 0 18px;font-size:17px}
.free-start{border:0;border-radius:30px;padding:13px 24px;font-weight:900;font-size:17px;color:#382000;background:linear-gradient(#fff0a8,#e9a82d);box-shadow:0 4px 0 #8a4b08}


.bet-value.bet-open{border:1px solid #d7ad61;border-radius:8px;background:linear-gradient(180deg,#5a3a20,#21150f);padding:4px 8px;min-width:57px;color:#fff;cursor:pointer;box-shadow:inset 0 1px 3px #fff3,0 2px 4px #000}
.bet-value.bet-open small{color:#ffdf85;font-size:8px}.bet-value.bet-open b{font-size:13px;color:#fff}
.bet-overlay{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.76);backdrop-filter:blur(3px)}
.bet-overlay.show{display:flex}
.bet-panel{width:min(92vw,350px);padding:15px;border:2px solid #e4b85b;border-radius:16px;background:radial-gradient(ellipse at top,#70431b 0,#24160f 58%,#100d12 100%);box-shadow:0 0 28px #f2b63b55,0 12px 35px #000c;color:#fff}
.bet-panel-head{display:flex;align-items:center;justify-content:space-between;color:#ffe29a;font:bold 17px Georgia,serif;letter-spacing:1px}
.bet-panel-head button{width:30px;height:30px;border:1px solid #d6a94d;border-radius:50%;background:#281912;color:#fff;font-size:22px;line-height:20px}
.bet-current{margin:13px 0 10px;padding:9px;border-radius:8px;background:#100d12;border:1px solid #795326;text-align:center;color:#e9c98c;font-size:10px;letter-spacing:1px}
.bet-current strong{display:block;margin-top:3px;color:#fff;font-size:22px}
.bet-options{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,auto);grid-auto-columns:minmax(0,1fr);gap:8px;transform:rotate(180deg)}
.bet-option{transform:rotate(180deg)}
.bet-option{padding:10px 3px;border:1px solid #b17c32;border-radius:8px;background:linear-gradient(180deg,#68421e,#302015);color:#ffe8b0;font-weight:900;font-size:13px;box-shadow:inset 0 1px 2px #fff2,0 2px 3px #0008}
.bet-option.active{background:linear-gradient(180deg,#fff2b4,#ffc33f 58%,#b96812);color:#542607;border:2px solid #fff0a2;box-shadow:0 0 12px #ffca4b88}
.bet-option:disabled{opacity:.28}
.bet-adjust{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0;color:#e8c98e;font-size:10px;letter-spacing:.8px}
.bet-adjust button{width:42px;height:34px;border:1px solid #e5bd68;border-radius:8px;background:linear-gradient(#9b672d,#4a2a13);color:#fff;font-size:21px;font-weight:900}
.bet-confirm{width:100%;padding:12px;border:1px solid #fff0a3;border-radius:24px;background:linear-gradient(#fff0a8,#ffc33d 55%,#b96a12);color:#5c2807;font-weight:1000;letter-spacing:1px;box-shadow:0 3px 0 #713b0b,0 0 12px #ffca4b66}


/* Super Ace one-second JILI intro */
.jili-loading{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050a19;opacity:1;visibility:visible;transition:opacity .18s ease,visibility .18s ease}
.jili-loading.hide{opacity:0;visibility:hidden;pointer-events:none}
.jili-logo{font:1000 56px Georgia,serif;letter-spacing:5px;color:#ffd76a;background:linear-gradient(180deg,#fff8c9 0%,#ffe98a 18%,#d99519 42%,#fff0a0 55%,#a85b08 78%,#ffe08a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:2px 3px 0 #70400b,4px 6px 0 #3b2108,0 0 14px #ffbf36;filter:drop-shadow(0 4px 3px #000)}
.jili-subtitle{margin-top:8px;color:#fff;font:16px Arial,sans-serif;letter-spacing:1px}
.jili-underline{width:190px;height:2px;margin-top:22px;border-radius:2px;background:linear-gradient(90deg,transparent,#ffe9a0 18%,#d99a27 50%,#ffe9a0 82%,transparent);box-shadow:0 0 8px #d99a27;transform-origin:center;animation:jiliLineShrink 1s linear forwards}
@keyframes jiliLineShrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.jili-underline{animation-duration:1s}}


/* BIG WIN / SUPER WIN popup */
.win-popup-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:999999}
.win-popup-overlay.is-visible{display:flex}
.win-popup{min-width:min(82vw,320px);max-width:90vw;padding:22px 30px 25px;border:2px solid #ffd76a;border-radius:18px;background:linear-gradient(145deg,#392000 0%,#120b02 55%,#4b2b00 100%);box-shadow:0 0 22px rgba(255,190,45,.55),inset 0 0 18px rgba(255,220,120,.12);color:#fff2b5;text-align:center;transform:scale(.72);opacity:0;animation:winPopupIn .42s cubic-bezier(.18,.85,.25,1.2) forwards}
.win-popup-title{margin:0 0 10px;color:#ffe17b;font:900 clamp(28px,8vw,44px)/1.05 Arial,sans-serif;letter-spacing:1.5px;text-shadow:0 2px 0 #8c4b00,0 0 14px rgba(255,205,64,.8)}
.win-popup-amount{color:#fff;font:900 clamp(30px,9vw,48px)/1.1 Arial,sans-serif;text-shadow:0 0 12px rgba(255,210,90,.75);overflow-wrap:anywhere}
.win-popup.is-super{border-color:#fff0a1;box-shadow:0 0 30px rgba(255,218,92,.85),inset 0 0 22px rgba(255,230,140,.2)}
.win-popup.is-super .win-popup-title{color:#fff3a6;text-shadow:0 0 18px #ffbd28,0 2px 0 #8c4b00}
@keyframes winPopupIn{0%{opacity:0;transform:scale(.72) translateY(12px)}70%{opacity:1;transform:scale(1.06) translateY(0)}100%{opacity:1;transform:scale(1)}}
@keyframes winPopupOut{to{opacity:0;transform:scale(.88) translateY(-8px)}}

</style></head><body><main class="game">
<div class="jili-loading" id="jiliLoading" aria-label="JILI Super Ace 2026 loading"><div class="jili-logo">JILI</div><div class="jili-subtitle">Super Ace 2026</div><div class="jili-underline"></div></div>

 </div>
</section>

 <div class="free-panel"><h2>🎉 FREE SPINS UNLOCKED!</h2><p id="freeOfferText">আপনি ১০টি Free Spin পেয়েছেন</p><button class="free-start" id="freeStart" type="button">START FREE SPINS</button></div>
</div>

 </div>
</div>

<!-- BIG WIN / SUPER WIN popup -->

 </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),gameId=new URLSearchParams(location.search).get('gameId')||'super-ace';
const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const definitions={
 ace:{rank:'A',suit:'♠',name:'ACE',tone:'#153d69'},
 king:{rank:'K',suit:'♛',name:'KING',tone:'#a72b32'},
 queen:{rank:'Q',suit:'♦',name:'QUEEN',tone:'#8b2b63'},
 jack:{rank:'J',suit:'⚔',name:'JACK',tone:'#245e55'},
 spade:{rank:'10',suit:'♠',name:'SPADE',tone:'#172d49'},
 heart:{rank:'10',suit:'♥',name:'HEART',tone:'#b52b39'},
 diamond:{rank:'10',suit:'♦',name:'DIAMOND',tone:'#b85b20'},
 club:{rank:'10',suit:'♣',name:'CLUB',tone:'#23634d'},
 wild:{rank:'W',suit:'✦',name:'WILD',tone:'#a65b12'},
 scatter:{rank:'S',suit:'✹',name:'SCATTER',tone:'#8b3420'}

async function loadSuperAceCardImages(){
 try{
  const response=await fetch('/api/superace-art');
  if(!response.ok)return;
  const data=await response.json();
  const images=data&&data.images&&typeof data.images==='object'?data.images:{};
  for(const key of Object.keys(images)){
   if(Object.prototype.hasOwnProperty.call(art,key))art[key]=images[key];
  }
 }catch(_){}
}

// Create a white version of the ordinary King from the same card artwork.
// Yellow/gold pixels are neutralized; the special goldenCard keeps the original gold artwork.
const whiteKingArtPromise=(async()=>{
 const source=new Image();
 source.src=art.king;
 try{if(source.decode)await source.decode();else await new Promise((resolve,reject)=>{source.onload=resolve;source.onerror=reject;});}catch(e){return art.king;}
 const canvas=document.createElement('canvas');
 canvas.width=source.naturalWidth||source.width;
 canvas.height=source.naturalHeight||source.height;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});
 if(!ctx)return art.king;
 ctx.drawImage(source,0,0);
 const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
 const data=pixels.data;
 for(let i=0;i<data.length;i+=4){
  const r=data[i],g=data[i+1],b=data[i+2];
  if(r>135&&g>90&&b<175&&r>=g*.88&&g>b*1.16){
   const lift=Math.min(1,Math.max(.68,(r+g+b)/765+.42));
   data[i]=Math.round(r+(255-r)*lift);
   data[i+1]=Math.round(g+(255-g)*lift);
   data[i+2]=Math.round(b+(255-b)*lift);
  }
 }
 ctx.putImageData(pixels,0,0);
 try{return canvas.toDataURL('image/png');}catch(e){return art.king;}
})();
let balance=0,bet=50,chosenX=1,busy=false,auto=false,turbo=false,freeSpins=0,comboX=1,totalWin=0;
let freeSpinReady=false;
let visibleGrid=[];
const ids=Object.keys(definitions);
function randomBoard(){return Array.from({length:20},()=>ids[Math.floor(Math.random()*ids.length)]);}
function draw(grid,wins,drop,spinning,goldenCells,replaceCells,replaceType,moves){
 visibleGrid=Array.isArray(grid)?[...grid]:[];
 const hit=new Set(wins||[]),transforms=new Set((goldenCells||[]).map(Number)),replacing=new Set(replaceCells||[]),falling=new Set(drop||[]);
 for(const index of transforms){if(String(visibleGrid[index]||'').startsWith('golden'))visibleGrid[index]='wild';}
 const moveByTarget=new Map((moves||[]).map(move=>[Number(move.to),move]));
 $('board').innerHTML='';
 grid.forEach((rawId,index)=>{
  const id=String(rawId??'').trim().toLowerCase()==='scatter'?'scatter':rawId;
  const cell=document.createElement('div');
  cell.className='tile'+(id==='goldenCard'?' golden-card':'')+(String(id||'').startsWith('golden')?' golden-copy':'')+(['goldenJoker','littleJoker'].includes(id)?' golden-joker':'')+(id==='bigJoker'?' big-joker':'')+(transforms.has(index)?' golden-transform':'')+(replacing.has(index)&&replaceType==='out'?' flip-out':'')+(falling.has(index)?' drop':'')+(hit.size&&!hit.has(index)?' dim':'')+(hit.has(index)?' win':'');
  cell.style.setProperty('--reel',String(index%5));
  if(falling.has(index)){
   const move=moveByTarget.get(index);
   const fromOffset=move?(Math.floor(Number(move.from)/5)-Math.floor(Number(move.to)/5))*100:-115;
   cell.style.setProperty('--fall-from',fromOffset+'%');
  }
  if(id===null||id===undefined||id==='empty'){cell.classList.add('empty');$('board').appendChild(cell);return;}
  if(id==='scatter'){
   const img=document.createElement('img');img.className='scatter-art';img.alt='SCATTER';img.draggable=false;img.decoding='async';img.src=art.scatter;
   img.onerror=()=>{img.remove();cell.classList.add('scatter-fallback');cell.innerHTML='<div class="scatter-coin"><b>＄</b><small>SCATTER</small></div>';};
   $('board').appendChild(cell);cell.appendChild(img);return;
  }
  const img=document.createElement('img');img.alt=id;img.draggable=false;img.decoding='async';img.loading='eager';
  const cardKey=String(id||'ace').trim().toLowerCase();
  const artKey=transforms.has(index)?'wild':cardKey==='goldencard'?'king':cardKey.startsWith('golden')?cardKey.slice(6):cardKey;
  img.onerror=()=>{if(cardKey==='scatter'){cell.classList.add('scatter-fallback');cell.innerHTML='<div class="scatter-coin"><b>★</b><small>SCATTER</small></div>';}else{img.onerror=null;img.src=art.ace;}};
  img.src=art[artKey]||art.ace;
  if(cardKey==='king')whiteKingArtPromise.then(src=>{if(img.isConnected&&cardKey==='king')img.src=src;});
  cell.appendChild(img);$('board').appendChild(cell);
 });
}
function update(){
 $('balance').textContent=fmt(balance);$('bet').textContent=String(bet);
 
 $('betCurrent').textContent=fmt(bet);
 renderBetOptions();
}
const BET_OPTIONS=[1,2,3,5,10,15,20,50,100,200,300,400,500,600,700,800,900,1000];
function renderBetOptions(){
 const host=$('betOptions');if(!host)return;
 host.innerHTML='';
 BET_OPTIONS.forEach(amount=>{
  const button=document.createElement('button');button.type='button';button.className='bet-option'+(amount===bet?' active':'');
  button.textContent=amount.toLocaleString('en-US');button.disabled=busy||amount>balance;
  button.addEventListener('click',()=>{if(busy||amount>balance)return;bet=amount;update();$('betOverlay').classList.remove('show');});
  host.appendChild(button);
 });
}
function openBetPicker(){if(busy)return;update();$('betOverlay').classList.add('show');}
function closeBetPicker(){$('betOverlay').classList.remove('show');}
function setCombo(value,isFree){
 const factor=isFree?2:1;
 const allowed=[1,2,3,5];
 const raw=Number(value)||factor;
 comboX=Math.max(factor,raw);
 const base=comboX/factor;
 const shown=allowed.includes(base)?base:allowed.reduce((best,n)=>Math.abs(n-base)<Math.abs(best-base)?n:best,1);
 document.querySelectorAll('.multi').forEach(b=>{
  const step=Number(b.dataset.x);
  const active=step===shown;
  b.textContent='×'+(step*factor);
  b.classList.toggle('active',active);
  b.setAttribute('aria-current',active?'true':'false');
 });
 $('comboMeter').setAttribute('aria-label','Combo multiplier ×'+(shown*factor));
}
function highlightExisting(wins){
 const hit=new Set(wins||[]);
 [...$('board').children].forEach((cell,index)=>{
  cell.classList.toggle('win',hit.has(index));
  cell.classList.toggle('dim',hit.size>0&&!hit.has(index));
 });
}
async function refillExisting(grid,cells){
 const board=[...$('board').children];
 for(const ix of [...new Set((cells||[]).map(Number).filter(n=>n>=0&&n<20))]){
  const cell=board[ix];if(!cell)continue;
  setCardFace(cell,grid[ix]);
  cell.style.setProperty('--fall-from','-115%');
  cell.classList.add('drop');
  await sleep(turbo?45:95);
  cell.classList.remove('drop');
 }
 visibleGrid=[...grid];
}
async function request(path,body){
 const token=localStorage.getItem('tk777_token')||'';
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
 let response,raw;
 try{
  response=await fetch('/api'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,signal:controller.signal});
  raw=await response.text();
 }catch(error){
  if(error&&error.name==='AbortError')throw Error('সার্ভার উত্তর দিতে দেরি করছে। আবার চেষ্টা করুন।');
  throw Error('সার্ভারের সঙ্গে সংযোগ হচ্ছে না। আবার চেষ্টা করুন।');
 }finally{clearTimeout(timeout)}
 let data;try{data=JSON.parse(raw)}catch(_){throw Error('সার্ভার থেকে সঠিক উত্তর পাওয়া যায়নি')}
 if(!response.ok)throw Error(data.error||'গেম চালু করা যায়নি');return data;
}

function setCardFace(cell,rawId){
 const id=String(rawId??'').trim().toLowerCase()==='scatter'?'scatter':rawId;
 cell.className='tile'+(id==='goldenCard'?' golden-card':'')+(String(id||'').startsWith('golden')?' golden-copy':'')+(['goldenJoker','littleJoker'].includes(id)?' golden-joker':'')+(id==='bigJoker'?' big-joker':'');
 cell.innerHTML='';
 if(id===null||id===undefined||id==='empty'){cell.classList.add('empty');return;}
 const img=document.createElement('img');
 img.draggable=false;img.decoding='async';img.loading='eager';
 if(id==='scatter'){
  img.className='scatter-art';img.alt='SCATTER';img.src=art.scatter;
  img.onerror=()=>{img.remove();cell.classList.add('scatter-fallback');cell.innerHTML='<div class="scatter-coin"><b>＄</b><small>SCATTER</small></div>';};
 }else{
  const key=String(id||'ace').trim().toLowerCase();
  const artKey=(key==='goldenjoker'||key==='littlejoker')?'goldenJoker':key==='bigjoker'?'wild':key==='goldencard'?'king':key.startsWith('golden')?key.slice(6):key;
  img.alt=String(id);img.src=art[artKey]||art.ace;
  img.onerror=()=>{img.onerror=null;img.src=art.ace;};
  // Keep the ordinary white King consistent during falling/cascade animations.
  // The separate goldenCard must retain its original gold artwork.
  if(key==='king')whiteKingArtPromise.then(src=>{if(img.isConnected&&key==='king')img.src=src;});
 }
 cell.appendChild(img);
}
function transformYellowKCells(cells){
 const boardCells=[...$('board').children];
 const changed=[];
 for(const rawIndex of (cells||[])){

  const img=cell.querySelector('img');

  img.alt='wild';img.src=art.wild;cell.classList.remove('golden-card','golden-copy');cell.classList.add('golden-transform');
  visibleGrid[index]='wild';changed.push(index);
 }
 return changed;
}
async function animateReels(grid){
 if(!Array.isArray(grid)||grid.length!==20)return;
 const cells=[...$('board').children];
 if(cells.length!==20){draw(grid);return;}
 // Empty the old faces, then drop each new card from above into its own fixed cell.
 for(let i=0;i<20;i++){
  const cell=cells[i];
  cell.className='tile empty';
  cell.innerHTML='';
 }
 const order=Array.from({length:20},(_,i)=>i);
 // Drop column-by-column, top to bottom: each card lands before the next follows.
 for(const index of order){
  const cell=cells[index];
  setCardFace(cell,grid[index]);
  cell.style.setProperty('--fall-from','-145%');
  cell.classList.add('drop');
  await sleep(turbo?38:82);
  cell.classList.remove('drop');
 }
 visibleGrid=[...grid];
}
async function animateAnticipationRow(grid){
 const cells=[...$('board').children];
 if(cells.length!==20)return;
 // The initial board is already displayed. Anticipation only flashes the row;
 // never set the same card faces again or replay their falling animation.
 for(let col=0;col<5;col++)cells[5+col].classList.add('anticipation-line');
 await sleep(turbo?130:360);
 cells.slice(5,10).forEach(cell=>cell.classList.remove('anticipation-line'));
}

let pendingSpinId=null;

let winPopupRunId=0;
const showWinSequence=(totalWinAmount,betAmount)=>{
 const id=++winPopupRunId;
 const overlay=$('winPopupOverlay'),popup=$('winPopup'),title=$('winPopupTitle'),amountNode=$('winPopupAmount');
 const win=Number(totalWinAmount),stake=Number(betAmount);
 if(!Number.isFinite(win)||!Number.isFinite(stake)||win<=0||stake<=0||win<stake*6){
  overlay.classList.remove('is-visible');return false;
 }
 const superThreshold=stake*15,hasSuper=win>=superThreshold;
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const format=value=>Math.floor(value).toLocaleString('en-US');
 const count=(from,to,duration)=>new Promise(resolve=>{
  const start=performance.now();
  const frame=now=>{
   if(id!==winPopupRunId)return resolve();
   const progress=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-progress,2.2);
   amountNode.textContent=format(from+(to-from)*eased);
   if(progress<1)requestAnimationFrame(frame);
   else{amountNode.textContent=format(to);resolve();}
  };
  requestAnimationFrame(frame);
 });
 overlay.classList.add('is-visible');
 popup.style.animation='none';void popup.offsetWidth;popup.style.animation='';
 popup.classList.remove('is-super');title.textContent='BIG WIN';amountNode.textContent='1';
 return (async()=>{
  await wait(650);if(id!==winPopupRunId)return false;
  if(hasSuper){
   await count(1,superThreshold,3800);if(id!==winPopupRunId)return false;
   await wait(900);if(id!==winPopupRunId)return false;
   title.textContent='SUPER WIN';popup.classList.add('is-super');
   await wait(500);if(id!==winPopupRunId)return false;
   await count(superThreshold,win,3000);if(id!==winPopupRunId)return false;
   await wait(1500);
  }else{
   await count(1,win,3800);if(id!==winPopupRunId)return false;
   await wait(1400);
  }
  if(id!==winPopupRunId)return false;
  popup.style.animation='winPopupOut .6s ease forwards';
  await wait(600);
  if(id===winPopupRunId){overlay.classList.remove('is-visible');popup.style.animation='';}
  return true;
 })();
};

async function play(){
 if(busy)return;
 if(!pendingSpinId){
  pendingSpinId=(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')
   ?crypto.randomUUID()
   :'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
 }
 const requestId=pendingSpinId;
 const stake=bet;
 if(stake>1000000){$('status').textContent='সর্বোচ্চ বেট ১,০০,০০০';return}
 if(freeSpins<=0&&balance<stake){$('status').textContent='পর্যাপ্ত ব্যালেন্স নেই';auto=false;return}
 busy=true;$('spin').disabled=true;update();totalWin=0;$('cascadeWin').textContent='0.00';$('win').textContent='0.00';$('win').parentElement.classList.remove('show');$('status').textContent='Spin';
 try{
  const pending=request('/play',{gameId:gameId,betAmount:bet,betMultiplier:1,freeSpin:freeSpins>0,requestId}).then(value=>({value}),error=>({error}));
  // Keep the landed board untouched until the server returns the real result.
  const outcome=await pending;if(outcome.error)throw outcome.error;const result=outcome.value;pendingSpinId=null;
  const frames=Array.isArray(result.frames)?result.frames:[];
  const firstBoard=frames[0]?.grid||result.finalGrid;
  // Play the first board exactly once. Later frames are cascade-only updates.
  if(firstBoard)await animateReels(firstBoard);
  balance=Number(result.balance||0);freeSpins=Number(result.freeSpins||0);if(freeSpins<=0)freeSpinReady=false;update();updateFreeSpinButton();sendBalanceToParent();
  if(!frames.length){await sleep(turbo?100:220)}
  else{
   for(const frame of frames){
    setCombo(frame.cascadeX||1,Boolean(result.freeSpin));
    if(frame.type==='anticipation'){
     // Only the second reel row flashes; the other fifteen landed cards stay fixed.
     await animateAnticipationRow(frame.grid);
     continue;
    }
    if(frame.type==='win'){
     highlightExisting(frame.wins||[]);
     $('cascadeWin').textContent=fmt(frame.winAmount||0);
     $('win').textContent=fmt(frame.totalWin||0);
     $('win').parentElement.classList.add('show');
     $('status').textContent='WIN +'+fmt(frame.winAmount||0)+' · TOTAL WIN '+fmt(frame.totalWin||0);
     await sleep(turbo?240:650);continue;
    }
    if(frame.type==='golden'){
     draw(frame.grid,[],[],false,frame.cells||[]);
     $('status').textContent='✨ YELLOW K → WILD';
     await sleep(turbo?260:620);continue;
    }
    if(frame.type==='remove'){
     draw(frame.grid,[],[],false,[],frame.cells||[],'out');
     $('status').textContent='WINNING CARDS · REMOVED';
     await sleep(turbo?140:300);continue;
    }
    if(frame.type==='drop'){
     draw(frame.grid,[],frame.cells||[],false,[],[],null,frame.moves||[]);
     $('status').textContent='CARDS FALLING...';
     await sleep(turbo?180:420);continue;
    }
    if(frame.type==='refill'){
     const arriving=[...new Set((frame.cells||[]).map(Number).filter(ix=>ix>=0&&ix<20))];
     $('status').textContent='NEW CARDS FROM ABOVE';
     // Render the complete refill once; repeated full-board redraws caused visible card shaking.
     await refillExisting(frame.grid,arriving);
     await sleep(turbo?100:220);
     continue;
    }
    draw(frame.grid,frame.wins||[]);
    await sleep(turbo?240:650);
   }
   // Keep the settled DOM intact when the final board is already displayed.
   if(Array.isArray(result.finalGrid)&&result.finalGrid.length===20&&JSON.stringify(visibleGrid)!==JSON.stringify(result.finalGrid))draw(result.finalGrid);
  }
  setCombo(freeSpins>0?2:1,freeSpins>0);
  totalWin=Math.max(0,Number(result.payout||0));showWinSequence(totalWin,stake);$('cascadeWin').textContent=fmt(frames.filter(f=>f.type==='win').slice(-1)[0]?.winAmount||0);$('win').textContent=fmt(totalWin);if(totalWin>0||frames.some(f=>f.type==='win'))$('win').parentElement.classList.add('show');
  const awarded=Number(result.freeSpinAward||0);if(awarded>0)showFreeSpinOffer();
  $('status').textContent=(awarded?'🎉 SCATTER BONUS · +'+awarded+' FREE SPINS · ':result.freeSpin?'FREE SPIN · ':'')+(Number(result.payout||0)>0?'WIN · MAX COMBO ×'+Number(result.maxCascadeX||1)+' · '+Number(result.cascadeCount||0)+' CASCADES':'NO WIN · TRY AGAIN')+(freeSpins?' · FREE SPINS LEFT '+freeSpins:'');
 }catch(e){$('status').textContent=e.message;try{const d=await request('/me');balance=Number(d.user.balance||0);update();sendBalanceToParent()}catch(_){}}
 finally{busy=false;$('spin').disabled=false;update();updateFreeSpinButton();if(freeSpinReady&&freeSpins>0){await sleep(turbo?180:500);if(freeSpinReady&&freeSpins>0)play()}else if(auto&&freeSpins<=0){await sleep(450);if(auto)play()}}
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aviator</title>
<style>
:root{--bg:#101012;--panel:#1b1b1e;--panel2:#202024;--green:#20ad08;--red:#f20b48;--muted:#88888d}
*{box-sizing:border-box}body{margin:0;background:#09090a;color:#eee;font-family:Arial,Helvetica,sans-serif}
.app{max-width:560px;margin:auto;background:var(--bg);min-height:100vh;padding-bottom:16px}
.header{height:72px;background:#1b1b1e;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-size:32px;font-weight:900;font-style:italic;color:#f20b48;letter-spacing:-2px}
.balance{font-size:19px;color:#aaa}.balance b{color:#20b30b}
.menu{font-size:24px;color:#85858a}
.history{height:72px;display:flex;align-items:center;gap:18px;padding:0 22px;white-space:nowrap;overflow:hidden;font-size:17px;background:#111113}
.history span:nth-child(3n+1){color:#55b8e8}.history span:nth-child(3n+2){color:#a35be5}.history span:nth-child(3n){color:#d72b9a}
.history .more{background:#29292d;color:#aaa;border-radius:22px;padding:5px 12px}
.arena{height:min(74vw,505px);min-height:300px;margin:0 8px;border:1px solid #343438;border-radius:32px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 52% 47%,#073149 0%,#071a26 24%,transparent 57%),repeating-conic-gradient(from 0deg at 0% 100%,#050506 0deg 8deg,#101012 8deg 16deg)}
#flight{position:absolute;inset:0;width:100%;height:100%}
.multiplier{position:absolute;z-index:2;left:0;right:0;top:43%;transform:translateY(-50%);text-align:center;font-size:clamp(48px,14vw,82px);font-weight:700;color:white;letter-spacing:-3px;text-shadow:0 2px 5px #000}
.crash-label{position:absolute;z-index:3;top:27%;left:0;right:0;text-align:center;font-size:13px;font-weight:bold;color:#fff;display:none}
.player-count{position:absolute;right:12px;bottom:12px;border-radius:30px;background:#19191bdc;padding:7px 14px;display:flex;align-items:center;gap:10px;font-size:18px}
.avatars{display:flex}.avatar{width:32px;height:32px;border:2px solid #29a82c;border-radius:50%;margin-right:-8px;background:linear-gradient(135deg,#1d8f8c,#e7a56d,#172e43)}
.bet-area{margin:8px;background:#1c1c1f;border-radius:34px;padding:12px 16px 14px}
.bet-tabs{height:54px;width:74%;margin:0 auto 10px;border-radius:30px;background:#151518;display:flex;padding:5px}
.bet-tabs button{flex:1;border:0;border-radius:24px;background:transparent;color:#999;font-size:17px}
.bet-tabs button.active{background:#303034;color:#eee}
.bet-content{display:grid;grid-template-columns: minmax(0, .8fr) minmax(0,1.2fr);gap:16px;align-items:stretch}
.left-controls{min-width:0}
.amount{height:56px;border-radius:30px;background:#151518;display:flex;align-items:center;justify-content:space-around;margin-bottom:8px}
.amount button{width:38px;height:38px;border-radius:50%;border:0;background:#303035;color:#aaa;font-size:25px}
.amount strong{font-size:27px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.presets button{border:0;border-radius:22px;background:#151518;color:#999;font-size:20px;padding:8px 2px}
.bet-action{border:2px solid #ddd;border-radius:24px;background:#20ad08;color:white;font-size:clamp(24px,6vw,38px);font-weight:400;min-height:145px;line-height:1.3;box-shadow:0 4px 0 #111;white-space:normal}
.bet-action.cash{background:#c77a12}.bet-action.cancel{background:#e00032}
.bet-action:disabled{opacity:.55}
.lower{margin:8px;background:#1c1c1f;border-radius:32px;padding:12px 16px 18px}
.lower-tabs{height:50px;border-radius:28px;background:#151518;display:flex;padding:5px;margin-bottom:12px}
.lower-tabs button{flex:1;border:0;background:none;color:#aaa;border-radius:24px;font-size:17px}
.lower-tabs button.active{background:#303034;color:#eee}.my-bet-row{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid #303034}.my-bet-row:last-child{border-bottom:0}
.summary{background:#151518;border-radius:25px;padding:12px 10px;color:#aaa}
.summary-top{display:flex;justify-content:space-between;align-items:center}
.summary strong{font-size:25px;color:#ccc}.summary .small{font-size:17px;margin-top:6px}
.progress{height:10px;background:#252529;border-radius:10px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;width:4%;background:#20ad08}
.admin{margin:12px 8px;background:#1c1c1f;border:1px solid #38383c;border-radius:18px;padding:12px}
.admin summary{font-weight:bold;cursor:pointer}.admin .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14px;color:#bbb}
.admin input{width:90px;background:#111;color:#fff;border:1px solid #555;border-radius:6px;padding:9px}
.admin button{border:0;border-radius:7px;padding:10px;background:#45454b;color:#fff}.admin .danger{background:#a21b34}
.note{text-align:center;color:#777;font-size:11px;padding:6px 14px}
@media(min-width:500px){.app{border-left:1px solid #222;border-right:1px solid #222}.arena{height:390px}}
</style></head>
<body><main class="app">
<header class="header"><div class="logo">Aviator</div><div class="balance"><b id="balance">10,000</b> BDT</div><div class="menu">☰</div></header>
<div class="history" id="history"><span>1.00x</span><span>8.71x</span><span>4.70x</span><span>3.06x</span><span>1.79x</span><span>3.95x</span><span>4.81x</span><span class="more">•••</span></div>
<section class="arena" id="arena"><canvas id="flight"></canvas><div class="crash-label" id="crashLabel">FLEW AWAY!</div><div class="multiplier" id="multiplier">1.00x</div><div class="player-count"><div class="avatars"><i class="avatar"></i><i class="avatar"></i><i class="avatar"></i></div><span id="players">1,691</span></div></section>
<section id="betPanels"></section>
<section class="lower"><div class="lower-tabs"><button class="active" data-lower-tab="all">All Bets</button><button data-lower-tab="previous">Previous</button><button data-lower-tab="top">Top</button><button data-lower-tab="mine">My Bets</button></div><div id="myBetHistory" class="summary" style="display:none;margin-top:10px"><b style="color:#eee">My Betting History</b><div id="myBetHistoryList" style="margin-top:10px;font-size:13px;color:#bbb">এখনো কোনো বেট হিস্টরি নেই।</div></div><div class="summary"><div class="summary-top"><div class="avatars"><i class="avatar"></i><i class="avatar"></i><i class="avatar"></i></div><strong id="totalWin">0.00</strong></div><div class="summary-top small"><span id="betCount">0/0 Bets</span><span>Total win BDT</span></div><div class="progress"><i></i></div></div></section>


</main>
<script>
/* TK777 API bridge - account authentication and server balance display. */
(()=>{
 const API='https://tk777-api.dhmatelecom.workers.dev';
 const tokenKey='tk777-api-user-token';
 const req=async(path,opts={})=>{const token=localStorage.getItem(tokenKey);const r=await fetch(API+path,{method:opts.method||'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(opts.body?{body:JSON.stringify(opts.body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||'API error '+r.status);return d};
 window.TK777API={base:API,request:req,token:()=>localStorage.getItem(tokenKey),logout:async()=>{try{await req('/api/logout',{method:'POST'})}finally{localStorage.removeItem(tokenKey);localStorage.removeItem('tk777-current')}},refreshUser:async()=>{const d=await req('/api/user/me');return d.user}};
 if(location.pathname.endsWith('/admin.html')){
  const gate=document.createElement('div');gate.id='tk777ApiAdminGate';gate.style='position:fixed;inset:0;background:#08080cf2;z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial';
  gate.innerHTML='<div style="background:#202027;color:white;padding:24px;border-radius:14px;width:min(360px,100%)"><h2>TK777 Admin Login</h2><input id="tk777-au" value="tk777admin" style="box-sizing:border-box;width:100%;padding:12px;margin:6px 0"><input id="tk777-ap" type="password" placeholder="Admin password" style="box-sizing:border-box;width:100%;padding:12px;margin:6px 0"><button id="tk777-al" style="padding:11px 18px">Login</button><p id="tk777-ae" style="color:#ff9999"></p></div>';
  document.addEventListener('DOMContentLoaded',()=>{document.body.appendChild(gate);document.getElementById('tk777-al').onclick=async()=>{const b=document.getElementById('tk777-al'),e=document.getElementById('tk777-ae');b.disabled=true;try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('tk777-au').value,password:document.getElementById('tk777-ap').value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Login failed');sessionStorage.setItem('tk777-admin-token',d.token);gate.remove();}catch(x){e.textContent=x.message;b.disabled=false}};});
 }
})();
</script>
<script>
(()=>{
 const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 const API='https://tk777-api.dhmatelecom.workers.dev',token=()=>localStorage.getItem('tk777-api-user-token');
 const call=async(path,opts={})=>{const r=await fetch(API+path,{method:opts.method||'GET',cache:'no-store',headers:{'Content-Type':'application/json',...(token()?{Authorization:'Bearer '+token()}:{})},...(opts.body?{body:JSON.stringify(opts.body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.message||'API error '+r.status);return d};
 let user=null,balance=0,round=0,phase='waiting',mult=1,history=[],bets=[],slots=[0,1].map(()=>({amount:100,bet:null,tab:'Bet',autoCash:null}));
 const root=$('betPanels');
 if(!token()){alert('গেম খেলতে আগে Login করুন।');location.href='index.html';return}
 root.innerHTML=slots.map((s,i)=>`<section class="bet-area" data-slot="${i}"><div class="bet-tabs"><button class="active" data-tab="Bet">Bet</button><button data-tab="Auto">Auto</button></div><div class="bet-content"><div class="left-controls"><div class="amount"><button data-minus type="button">−</button><input class="amountInput" type="number" inputmode="numeric" min="1" max="1000000" step="1" value="100" aria-label="Custom bet amount" style="width:92px;min-width:0;text-align:center;font-size:22px;font-weight:700;color:#fff;background:transparent;border:0;outline:none"><button data-plus type="button">+</button></div><div class="presets"><button data-amount="100">100</button><button data-amount="200">200</button><button data-amount="500">500</button><button data-amount="1000">1,000</button></div><div class="autoOptions" hidden style="font-size:11px;color:#aaa;margin-top:8px">Auto cash out × <input class="autoCash" type="number" min="1.01" step=".01" placeholder="e.g. 2.00" style="width:65px;background:#111;color:white;border:1px solid #555;border-radius:5px;padding:5px"></div></div><button class="bet-action">Bet<br>100.00 BDT</button></div></section>`).join('');
 function paintBalance(){ $('balance').textContent=fmt(balance); }
 function historyRender(){const el=$('myBetHistoryList');if(!el)return;const rows=bets.filter(x=>['won','lost','cancelled'].includes(x.state)).slice(0,20);el.innerHTML=rows.length?rows.map(x=>`<div class="my-bet-row"><div><b>${x.state.toUpperCase()}</b><div style="color:#888;margin-top:3px">Round ${x.round}</div></div><div style="text-align:right"><b>${fmt(x.stake)} coins</b><div style="color:${x.state==='won'?'#20ad08':'#f20b48'};margin-top:3px">${x.state==='won'?'+':''}${fmt(x.state==='won'?x.payout-x.stake:-x.stake)} coins</div></div></div>`).join(''):'এখনো কোনো বেট হিস্টরি নেই।';}
 function getSlotBet(i){return bets.find(x=>Number(x.slot)===i&&Number(x.round)===round&&['pending','active'].includes(x.state))||null}
 function render(){paintBalance();$('multiplier').textContent=fmt(mult)+'x';$('multiplier').style.color=phase==='crashed'?'#f20b48':'#fff';$('crashLabel').style.display=phase==='crashed'?'block':'none';
  slots.forEach((s,i)=>{s.bet=getSlotBet(i);const p=root.querySelector(`[data-slot="${i}"]`),btn=p.querySelector('.bet-action');p.querySelector('.amountInput').value=String(s.amount);p.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===s.tab));p.querySelector('.autoOptions').hidden=s.tab!=='Auto';btn.className='bet-action';btn.disabled=false;
   if(!s.bet){btn.innerHTML=`Bet<br>${fmt(s.amount)} BDT`;btn.disabled=phase!=='waiting'}
   else if(s.bet.state==='pending'){btn.textContent='Cancel';btn.classList.add('cancel');btn.disabled=phase!=='waiting'}
   else if(s.bet.state==='active'){btn.innerHTML=`Cash Out<br>${fmt(s.bet.stake*mult)} BDT`;btn.classList.add('cash');btn.disabled=phase!=='flying'}
   else{btn.textContent=s.bet.state==='won'?'Cashed Out':'FLEW AWAY!';btn.disabled=true}
  });historyRender();
 }
 async function refreshBets(){const d=await call('/api/game/bets');bets=d.bets||[];}
 let lastBalanceSync=0; async function syncBalance(force=false){const now=Date.now();if(!force&&now-lastBalanceSync<2000)return;lastBalanceSync=now;const u=await call('/api/user/me');balance=Number(u.user.balance||0);paintBalance()}
 let refreshing=false; async function refreshGame(){if(refreshing)return;refreshing=true;try{const d=await call('/api/game/state');const g=d.game;if(!g)return;const changed=round!==Number(g.round);round=Number(g.round);phase=g.phase;mult=Number(g.multiplier||1);history=(g.history||[]).map(v=>Number(v).toFixed(2)+'x');if(history.length)$('history').innerHTML=history.map(v=>'<span>'+v+'</span>').join('')+'<span class="more">•••</span>';await refreshBets();
   for(let i=0;i<2;i++){const b=getSlotBet(i),s=slots[i];if(b&&b.state==='active'&&phase==='flying'&&s.autoCash&&mult>=s.autoCash&&!s.autoBusy){s.autoBusy=true;try{await call('/api/game/bet/cashout',{method:'POST',body:{id:b.id,autoMultiplier:s.autoCash}});const u=await call('/api/user/me');balance=Number(u.user.balance||0);await refreshBets()}catch(e){}finally{s.autoBusy=false}}}
   await syncBalance();render();
  }catch(e){if(/unauthorized/i.test(e.message)){alert('Session শেষ হয়েছে। আবার Login করুন।');location.href='index.html'}else console.warn(e)}finally{refreshing=false}}
 async function action(i){const s=slots[i],b=getSlotBet(i);try{
  if(b?.state==='pending'&&phase==='waiting'){await call('/api/game/bet/cancel',{method:'POST',body:{id:b.id}})}
  else if(b?.state==='active'&&phase==='flying'){await call('/api/game/bet/cashout',{method:'POST',body:{id:b.id}})}
  else if(!b&&phase==='waiting'){await call('/api/game/bet',{method:'POST',body:{amount:s.amount,slot:i}})}
  await syncBalance(true);await refreshGame();
 }catch(e){alert(e.message);await syncBalance(true).catch(()=>{});await refreshGame()}}
 root.querySelectorAll('[data-slot]').forEach(p=>{const i=Number(p.dataset.slot);p.querySelector('.bet-action').onclick=()=>action(i);p.querySelector('[data-minus]').onclick=()=>{slots[i].amount=Math.max(1,slots[i].amount-10);render()};p.querySelector('[data-plus]').onclick=()=>{slots[i].amount=Math.min(1000000,slots[i].amount+10);render()};p.querySelector('.amountInput').oninput=e=>{const raw=e.target.value,v=Number(raw);if(raw!==''&&Number.isInteger(v)&&v>=1&&v<=1000000){slots[i].amount=v;if(!slots[i].bet)p.querySelector('.bet-action').innerHTML='Bet<br>'+fmt(v)+' BDT'}};p.querySelector('.amountInput').onchange=e=>{const v=Number(e.target.value);if(!Number.isInteger(v)||v<1||v>1000000){alert('১ থেকে ১০,০০,০০০ পূর্ণসংখ্যা দিন।');e.target.value=String(slots[i].amount);return}slots[i].amount=v;render()};p.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>{slots[i].amount=Number(b.dataset.amount);render()});p.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{slots[i].tab=b.dataset.tab;render()});p.querySelector('.autoCash').onchange=e=>slots[i].autoCash=Number(e.target.value)>=1.01?Number(e.target.value):null});
 document.querySelectorAll('[data-lower-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-lower-tab]').forEach(x=>x.classList.toggle('active',x===b));$('myBetHistory').style.display=b.dataset.lowerTab==='mine'?'block':'none';}));
 const canvas=$('flight'),ctx=canvas.getContext('2d');function resize(){const r=$('arena').getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}window.addEventListener('resize',resize);resize();
 function paint(){const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;ctx.clearRect(0,0,w,h);if(phase!=='flying'&&phase!=='crashed')return;const t=Math.max(0,Math.min(1,(mult-1)/Math.max(.01,Math.max(mult,2)-1)));const x=30+t*w*.55,y=h-12-Math.pow(t,1.55)*h*.72;ctx.beginPath();ctx.moveTo(18,h-4);ctx.bezierCurveTo(w*.2,h-5,w*.22,h*.7,x,y);ctx.lineTo(x,h-4);ctx.closePath();ctx.fillStyle='rgba(229,0,47,.36)';ctx.fill();ctx.beginPath();ctx.moveTo(18,h-4);ctx.bezierCurveTo(w*.2,h-5,w*.22,h*.7,x,y);ctx.strokeStyle='#f20b48';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(-.2);ctx.fillStyle='#f20b48';ctx.beginPath();ctx.moveTo(-25,2);ctx.lineTo(12,-4);ctx.lineTo(23,-18);ctx.lineTo(27,-17);ctx.lineTo(22,-3);ctx.lineTo(38,1);ctx.lineTo(38,5);ctx.lineTo(19,7);ctx.lineTo(10,18);ctx.lineTo(5,17);ctx.lineTo(8,7);ctx.lineTo(-19,10);ctx.closePath();ctx.fill();ctx.restore()}
 function loop(){paint();requestAnimationFrame(loop)}
 async function init(){try{const d=await call('/api/user/me');user=d.user;balance=Number(user.balance||0);await refreshGame();setInterval(refreshGame,500);loop()}catch(e){alert('Login প্রয়োজন: '+e.message);location.href='index.html'}}
 $('players').textContent='—';init();
})();
</script>
</body></html>

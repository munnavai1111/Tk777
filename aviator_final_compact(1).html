<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aviator — Virtual Coin Demo</title>
<style>
:root{--bg:#101012;--panel:#1b1b1e;--panel2:#202024;--green:#20ad08;--red:#f20b48;--muted:#88888d}
*{box-sizing:border-box}body{margin:0;background:#09090a;color:#eee;font-family:Arial,Helvetica,sans-serif}
.app{max-width:390px;margin:auto;background:var(--bg);min-height:100vh;padding-bottom:5px}
.header{height:72px;background:#1b1b1e;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-size:32px;font-weight:900;font-style:italic;color:#f20b48;letter-spacing:-2px}
.balance{font-size:19px;color:#aaa}.balance b{color:#20b30b}
.menu{font-size:24px;color:#85858a}
.history{height:72px;display:flex;align-items:center;gap:18px;padding:0 22px;white-space:nowrap;overflow:hidden;font-size:17px;background:#111113}
.history span:nth-child(3n+1){color:#55b8e8}.history span:nth-child(3n+2){color:#a35be5}.history span:nth-child(3n){color:#d72b9a}
.history .more{background:#29292d;color:#aaa;border-radius:22px;padding:5px 12px}
.arena{height:min(55vw,220px);min-height:185px;margin:0 8px;border:1px solid #343438;border-radius:32px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 52% 47%,#073149 0%,#071a26 24%,transparent 57%),repeating-conic-gradient(from 0deg at 0% 100%,#050506 0deg 8deg,#101012 8deg 16deg)}
#flight{position:absolute;inset:0;width:100%;height:100%}
.multiplier{position:absolute;z-index:2;left:0;right:0;top:43%;transform:translateY(-50%);text-align:center;font-size:clamp(34px,9vw,54px);font-weight:700;color:white;letter-spacing:-3px;text-shadow:0 2px 5px #000;transition:color .12s,text-shadow .12s}.multiplier.crashed{color:#ff174f;text-shadow:0 0 10px rgba(255,23,79,.6),0 2px 5px #000}
.crash-label{position:absolute;z-index:3;top:27%;left:0;right:0;text-align:center;font-size:13px;font-weight:bold;color:#fff;display:none}
.player-count{position:absolute;right:12px;bottom:12px;border-radius:30px;background:#19191bdc;padding:7px 14px;display:flex;align-items:center;gap:10px;font-size:18px}
.avatars{display:flex}.avatar{width:32px;height:32px;border:2px solid #29a82c;border-radius:50%;margin-right:-8px;background:linear-gradient(135deg,#1d8f8c,#e7a56d,#172e43)}
.bet-area{margin:8px;background:#1c1c1f;border-radius:34px;padding:12px 16px 14px}
.bet-tabs{height:54px;width:74%;margin:0 auto 10px;border-radius:30px;background:#151518;display:flex;padding:5px}
.bet-tabs button{flex:1;border:0;border-radius:24px;background:transparent;color:#999;font-size:17px}
.bet-tabs button.active{background:#303034;color:#eee}
.bet-content{display:grid;grid-template-columns: minmax(0, .8fr) minmax(0,1.2fr);gap:16px;align-items:stretch}
.left-controls{min-width:0}
.amount{height:56px;border-radius:30px;background:#151518;display:flex;align-items:center;justify-content:space-around;margin-bottom:8px}
.amount button{width:38px;height:38px;border-radius:50%;border:0;background:#303035;color:#aaa;font-size:25px}
.amount strong{font-size:27px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.presets button{border:0;border-radius:22px;background:#151518;color:#999;font-size:20px;padding:8px 2px}
.bet-action{border:2px solid #ddd;border-radius:24px;background:#20ad08;color:white;font-size:clamp(24px,6vw,38px);font-weight:400;min-height:145px;line-height:1.3;box-shadow:0 4px 0 #111;white-space:normal}
.bet-action.cash{background:#c77a12}.bet-action.cancel{background:#e00032}
.bet-action:disabled{opacity:.55}
.lower{margin:8px;background:#1c1c1f;border-radius:32px;padding:12px 16px 18px}
.lower-tabs{height:50px;border-radius:28px;background:#151518;display:flex;padding:5px;margin-bottom:12px}
.lower-tabs button{flex:1;border:0;background:none;color:#aaa;border-radius:24px;font-size:17px}
.lower-tabs button.active{background:#303034;color:#eee}.my-bet-row{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid #303034}.my-bet-row:last-child{border-bottom:0}
.summary{background:#151518;border-radius:25px;padding:12px 10px;color:#aaa}
.summary-top{display:flex;justify-content:space-between;align-items:center}
.summary strong{font-size:25px;color:#ccc}.summary .small{font-size:17px;margin-top:6px}
.progress{height:10px;background:#252529;border-radius:10px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;width:4%;background:#20ad08}
.admin{margin:12px 8px;background:#1c1c1f;border:1px solid #38383c;border-radius:18px;padding:12px}
.admin summary{font-weight:bold;cursor:pointer}.admin .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14px;color:#bbb}
.admin input{width:90px;background:#111;color:#fff;border:1px solid #555;border-radius:6px;padding:9px}
.admin button{border:0;border-radius:7px;padding:10px;background:#45454b;color:#fff}.admin .danger{background:#a21b34}
.note{text-align:center;color:#777;font-size:11px;padding:6px 14px}
@media(min-width:500px){.app{max-width:390px;border-left:1px solid #222;border-right:1px solid #222}.arena{height:210px;min-height:210px}}
</style></head>
<body><main class="app">
<header class="header"><div class="logo">Aviator</div><div class="balance"><b id="balance">10,000</b> BDT</div><div class="menu">☰</div></header>
<div class="history" id="history"><span>1.00x</span><span>8.71x</span><span>4.70x</span><span>3.06x</span><span>1.79x</span><span>3.95x</span><span>4.81x</span><span class="more">•••</span></div>
<section class="arena" id="arena"><canvas id="flight"></canvas><div class="crash-label" id="crashLabel">FLEW AWAY!</div><div class="crash-label" id="waitLabel" style="display:none;color:#fff;top:24%">NEXT ROUND IN 3</div><div class="multiplier" id="multiplier">1.00x</div><div class="player-count"><div class="avatars"><i class="avatar"></i><i class="avatar"></i><i class="avatar"></i></div><span id="players">1,691</span></div></section>
<section id="betPanels"></section>
<section class="lower"><div class="lower-tabs"><button class="active" data-lower-tab="all">All Bets</button><button data-lower-tab="previous">Previous</button><button data-lower-tab="top">Top</button><button data-lower-tab="mine">My Bets</button></div><div id="myBetHistory" class="summary" style="display:none;margin-top:10px"><b style="color:#eee">My Betting History</b><div id="myBetHistoryList" style="margin-top:10px;font-size:13px;color:#bbb">এখনো কোনো বেট হিস্টরি নেই।</div></div><div class="summary"><div class="summary-top"><div class="avatars"><i class="avatar"></i><i class="avatar"></i><i class="avatar"></i></div><strong id="totalWin">0.00</strong></div><div class="summary-top small"><span id="betCount">0/0 Bets</span><span>Total win BDT</span></div><div class="progress"><i></i></div></div></section>


</main>
<script>
/* TK777 API bridge - account authentication and server balance display. */
(()=>{
 const API='https://tk777-api.dhmatelecom.workers.dev';
 const tokenKey='tk777-api-user-token';
 const req=async(path,opts={})=>{const token=localStorage.getItem(tokenKey);const r=await fetch(API+path,{method:opts.method||'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(opts.body?{body:JSON.stringify(opts.body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.message||'API error '+r.status);return d};
 window.TK777API={base:API,request:req,token:()=>localStorage.getItem(tokenKey),logout:async()=>{try{await req('/api/logout',{method:'POST'})}finally{localStorage.removeItem(tokenKey);localStorage.removeItem('tk777-current')}},refreshUser:async()=>{const d=await req('/api/user/me');return d.user}};
 if(location.pathname.endsWith('/admin.html')){
  const gate=document.createElement('div');gate.id='tk777ApiAdminGate';gate.style='position:fixed;inset:0;background:#08080cf2;z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial';
  gate.innerHTML='<div style="background:#202027;color:white;padding:24px;border-radius:14px;width:min(360px,100%)"><h2>TK777 Admin Login</h2><input id="tk777-au" value="tk777admin" style="box-sizing:border-box;width:100%;padding:12px;margin:6px 0"><input id="tk777-ap" type="password" placeholder="Admin password" style="box-sizing:border-box;width:100%;padding:12px;margin:6px 0"><button id="tk777-al" style="padding:11px 18px">Login</button><p id="tk777-ae" style="color:#ff9999"></p></div>';
  document.addEventListener('DOMContentLoaded',()=>{document.body.appendChild(gate);document.getElementById('tk777-al').onclick=async()=>{const b=document.getElementById('tk777-al'),e=document.getElementById('tk777-ae');b.disabled=true;try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('tk777-au').value,password:document.getElementById('tk777-ap').value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Login failed');sessionStorage.setItem('tk777-admin-token',d.token);gate.remove();}catch(x){e.textContent=x.message;b.disabled=false}};});
 }
})();
</script>
<script>
(()=>{
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const currentUser=localStorage.getItem('tk777-current')||'';
function readWalletBalance(){if(!currentUser)return 0;try{const db=JSON.parse(localStorage.getItem('tk777-users')||'{}');return Math.max(0,Number(db[currentUser]?.balance||0));}catch(e){return 0;}}
let balance=readWalletBalance(),round=1,phase='waiting',mult=1,crashAt=2.55,manualNext=null,started=0,waitUntil=Date.now()+3000,history=[],slots=[0,1].map(()=>({amount:1,bet:null,tab:'Bet',autoCash:null}));
const betHistoryKey='tk777-aviator-bets-'+(currentUser||'guest');
function readBetHistory(){try{return JSON.parse(localStorage.getItem(betHistoryKey)||'[]')}catch(e){return []}}
let myBetHistory=readBetHistory();
function addBetHistory(action,stake,result,detail=''){
 const item={time:new Date().toLocaleString('bn-BD'),round,action,stake:Number(stake||0),result:Number(result||0),detail};
 myBetHistory.unshift(item);myBetHistory=myBetHistory.slice(0,100);
 try{localStorage.setItem(betHistoryKey,JSON.stringify(myBetHistory))}catch(e){}
 renderBetHistory();
}
function renderBetHistory(){
 const el=$('myBetHistoryList');if(!el)return;
 if(!myBetHistory.length){el.textContent='এখনো কোনো বেট হিস্টরি নেই।';return}
 el.innerHTML=myBetHistory.map(x=>`<div class="my-bet-row"><div><b>${x.action}</b><div style="color:#888;margin-top:3px">${x.time} · Round ${x.round}</div></div><div style="text-align:right"><b>${fmt(x.stake)} BDT</b><div style="color:${x.result>=0?'#20ad08':'#f20b48'};margin-top:3px">${x.result>=0?'+':''}${fmt(x.result)} BDT</div></div></div>`).join('');
}
document.querySelectorAll('[data-lower-tab]').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('[data-lower-tab]').forEach(x=>x.classList.toggle('active',x===b));
 $('myBetHistory').style.display=b.dataset.lowerTab==='mine'?'block':'none';
}));
renderBetHistory();
const panelRoot=$('betPanels');
panelRoot.innerHTML=slots.map((s,i)=>`<section class="bet-area" data-slot="${i}"><div class="bet-tabs"><button class="active" data-tab="Bet">Bet</button><button data-tab="Auto">Auto</button></div><div class="bet-content"><div class="left-controls"><div class="amount"><button data-minus>−</button><input class="amountText" type="number" min="1" step="1" value="1" aria-label="Bet amount" style="width:64px;min-width:0;background:transparent;border:0;color:#fff;text-align:center;font-size:17px;font-weight:bold;outline:none;padding:0"><button data-plus>+</button></div><div class="presets"><button data-amount="100">100</button><button data-amount="200">200</button><button data-amount="500">500</button><button data-amount="10000">10,000</button></div><div class="autoOptions" hidden style="font-size:11px;color:#aaa;margin-top:8px">Auto cash out × <input class="autoCash" type="number" min="1.01" step=".01" placeholder="e.g. 2.00" style="width:65px;background:#111;color:white;border:1px solid #555;border-radius:5px;padding:5px"></div></div><button class="bet-action">Bet<br>1.00 BDT</button></div></section>`).join('');
function drawPanel(i){const p=panelRoot.querySelector(`[data-slot="${i}"]`),s=slots[i],b=s.bet,btn=p.querySelector('.bet-action');p.querySelector('.amountText').value=String(s.amount);p.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===s.tab));p.querySelector('.autoOptions').hidden=s.tab!=='Auto';btn.className='bet-action';btn.disabled=false;
if(!b){btn.innerHTML=`Bet<br>${fmt(s.amount)} BDT`;btn.disabled=phase!=='waiting'}
else if(b.state==='pending'){btn.textContent='Cancel';btn.classList.add('cancel');btn.disabled=phase!=='waiting'}
else if(b.state==='active'){btn.innerHTML=`Cash Out<br>${fmt(b.stake*mult)} BDT`;btn.classList.add('cash');btn.disabled=phase!=='flying'}
else{btn.innerHTML=b.state==='won'?`Cashed Out<br>${fmt(b.payout)} BDT`:'FLEW AWAY!';btn.disabled=true}
}
function saveWalletBalance(){if(!currentUser)return;try{const db=JSON.parse(localStorage.getItem('tk777-users')||'{}');if(!db[currentUser])return;db[currentUser].balance=Number(balance.toFixed(2));localStorage.setItem('tk777-users',JSON.stringify(db));}catch(e){console.warn('Wallet balance could not be saved',e);}}
function render(){ $('balance').textContent=fmt(balance);$('multiplier').textContent=mult.toFixed(2)+'x';$('multiplier').classList.toggle('crashed',phase==='crashed');$('crashLabel').style.display=phase==='crashed'?'block':'none';$('waitLabel').style.display=phase==='waiting'?'block':'none';slots.forEach((_,i)=>drawPanel(i));}
function logHistory(x){history.unshift(x.toFixed(2)+'x');history=history.slice(0,12);$('history').innerHTML=history.map(v=>`<span>${v}</span>`).join('')+'<span class="more">•••</span>';adminSend({type:'history',history:history.slice(),lastCrash:x.toFixed(2)+'x',round})}
function nextRound(){phase='waiting';mult=1;crashAt=manualNext??+(1.1+Math.random()*5.5).toFixed(2);manualNext=null;slots.forEach(s=>{if(s.bet&&s.bet.state!=='pending')s.bet=null});waitUntil=Date.now()+3000;render();adminSend({type:'round-state',phase,round,nextCrash:+crashAt.toFixed(2),history:history.slice()})}
function startRound(){phase='flying';started=Date.now();slots.forEach(s=>{if(s.bet?.state==='pending')s.bet.state='active'});render();adminSend({type:'round-state',phase,round,multiplier:1,history:history.slice()})}
function crash(){if(phase!=='flying')return;phase='crashed';mult=crashAt;slots.forEach((s,i)=>{if(s.bet?.state==='active'){s.bet.state='lost';addBetHistory('Lost',s.bet.stake,-s.bet.stake,'রাউন্ড ক্র্যাশ করেছে')}});logHistory(crashAt);render();adminSend({type:'round-state',phase,round,multiplier:+mult.toFixed(2),history:history.slice(),lastCrash:mult.toFixed(2)+'x'});round++;setTimeout(nextRound,2800)}
function cashout(i){let b=slots[i].bet;if(!b||b.state!=='active'||phase!=='flying')return;b.payout=b.stake*mult;balance+=b.payout;b.state='won';saveWalletBalance();addBetHistory('Cash Out',b.stake,b.payout-b.stake,`মোট ফেরত ${fmt(b.payout)}`);render()}
function clickAction(i){let s=slots[i],b=s.bet;if(b?.state==='pending'&&phase==='waiting'){balance+=b.stake;addBetHistory('Cancel',b.stake,0,'বেট বাতিল');s.bet=null;saveWalletBalance();render();return}if(b?.state==='active'){cashout(i);return}if(!b&&phase==='waiting'){if(!currentUser){alert('গেম খেলতে আগে অ্যাকাউন্টে লগইন করুন।');return}if(s.amount>balance)return;balance-=s.amount;s.bet={stake:s.amount,state:'pending'};addBetHistory('Bet',s.amount,0,'বেট প্লেস হয়েছে');saveWalletBalance();render()}}
panelRoot.querySelectorAll('[data-slot]').forEach(p=>{let i=+p.dataset.slot;p.querySelector('.bet-action').onclick=()=>clickAction(i);p.querySelector('[data-minus]').onclick=()=>{slots[i].amount=Math.max(1,slots[i].amount-10);render()};p.querySelector('[data-plus]').onclick=()=>{slots[i].amount+=10;render()};p.querySelector('.amountText').onchange=e=>{const v=Number(e.target.value);slots[i].amount=Number.isFinite(v)&&v>=1?Math.floor(v):1;render()};p.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>{slots[i].amount=+b.dataset.amount;render()});p.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{slots[i].tab=b.dataset.tab;render()});p.querySelector('.autoCash').onchange=e=>slots[i].autoCash=+e.target.value||null});
// Separate admin bridge: BroadcastChannel plus localStorage fallback.
let adminChannel=null;
const adminKey='aviator_demo_bus_v2';
function adminSend(data){
 const packet={...data,ts:Date.now(),round};
 try{adminChannel?.postMessage(packet)}catch(e){}
 try{localStorage.setItem(adminKey,JSON.stringify(packet))}catch(e){}
}
function adminStatus(){
 return {type:'game-state',phase,multiplier:+mult.toFixed(2),round,history:history.slice(),nextCrash:+crashAt.toFixed(2)};
}
function receiveAdmin(d){
 if(!d)return;
 if(d.type==='set-next' && Number(d.value)>=1.01 && Number(d.value)<=100){
   manualNext=Number(d.value);
   if(phase==='waiting')crashAt=manualNext;
   adminSend({type:'ack',message:'পরবর্তী রাউন্ডের ফলাফল সেট হয়েছে: '+manualNext.toFixed(2)+'x'});
 }
 if(d.type==='random-next' && phase==='waiting'){
   manualNext=+(1.1+Math.random()*5.5).toFixed(2);crashAt=manualNext;
   adminSend({type:'ack',message:'র‍্যান্ডম ফলাফল তৈরি হয়েছে: '+manualNext.toFixed(2)+'x'});
 }
 if(d.type==='crash-now')crash();
}
try{
 adminChannel=new BroadcastChannel('aviator-demo-admin-v2');
 adminChannel.onmessage=ev=>receiveAdmin(ev.data);
 adminChannel.postMessage({type:'game-ready',...adminStatus()});
}catch(e){}
window.addEventListener('storage',e=>{
 if(e.key===adminKey&&e.newValue){try{receiveAdmin(JSON.parse(e.newValue))}catch(err){}}
});
window.addEventListener('storage',e=>{if(e.key==='tk777-users'){const latest=readWalletBalance();if(Number.isFinite(latest)){balance=latest;render();}}});
setInterval(()=>adminSend(adminStatus()),1000);
const canvas=$('flight'),ctx=canvas.getContext('2d');
function resize(){let r=$('arena').getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}window.addEventListener('resize',resize);resize();
function paint(){let w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;ctx.clearRect(0,0,w,h);if(phase!=='flying'&&phase!=='crashed')return;let t=Math.max(0,Math.min(1,(mult-1)/Math.max(.01,crashAt-1)));let x=30+t*w*.55,y=h-12-Math.pow(t,1.55)*h*.72;ctx.beginPath();ctx.moveTo(18,h-4);ctx.bezierCurveTo(w*.2,h-5,w*.22,h*.7,x,y);ctx.lineTo(x,h-4);ctx.closePath();ctx.fillStyle='rgba(229,0,47,.36)';ctx.fill();ctx.beginPath();ctx.moveTo(18,h-4);ctx.bezierCurveTo(w*.2,h-5,w*.22,h*.7,x,y);ctx.strokeStyle='#f20b48';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(-.2);ctx.fillStyle='#f20b48';ctx.beginPath();ctx.moveTo(-25,2);ctx.lineTo(12,-4);ctx.lineTo(23,-18);ctx.lineTo(27,-17);ctx.lineTo(22,-3);ctx.lineTo(38,1);ctx.lineTo(38,5);ctx.lineTo(19,7);ctx.lineTo(10,18);ctx.lineTo(5,17);ctx.lineTo(8,7);ctx.lineTo(-19,10);ctx.closePath();ctx.fill();ctx.restore()}
function loop(){let now=Date.now();if(phase==='waiting'){$('waitLabel').textContent='NEXT ROUND IN '+Math.max(0,Math.ceil((waitUntil-now)/1000));if(now>=waitUntil)startRound();}if(phase==='flying'){mult=Math.exp((now-started)/1000*.17);slots.forEach(s=>{if(s.bet?.state==='active'&&s.autoCash&&mult>=s.autoCash){s.bet.payout=s.bet.stake*s.autoCash;balance+=s.bet.payout;s.bet.state='won';saveWalletBalance();addBetHistory('Auto Cash Out',s.bet.stake,s.bet.payout-s.bet.stake,`মোট ফেরত ${fmt(s.bet.payout)}`)}});if(mult>=crashAt)crash();else render()}paint();requestAnimationFrame(loop)}
nextRound();loop();
// Stable, readable demo player count: changes by a few users at a time.
let visiblePlayers=1691;
$('players').textContent=visiblePlayers.toLocaleString('en-US');
setInterval(()=>{
 const delta=(Math.floor(Math.random()*5)+1)*(Math.random()<.5?-1:1);
 visiblePlayers=Math.max(14,Math.min(1704,visiblePlayers+delta));
 $('players').textContent=visiblePlayers.toLocaleString('en-US');
},1500);

})();
</script></body></html>
